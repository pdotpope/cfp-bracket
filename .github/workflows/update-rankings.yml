name: Update Weekly Rankings

on:
  schedule:
    # Wednesday 05:00 UTC = midnight ET Tuesday night (EST, UTC-5), which
    # covers the whole CFP rankings window (Nov–early Dec). The committee
    # reveals rankings Tuesday evening ET, so this leaves a few hours for
    # CFBD to ingest them. Cron is UTC-only, so during EDT this would land
    # at 1am ET instead — irrelevant here since no CFP rankings exist then.
    # GitHub may also start scheduled runs late under load; that's fine.
    - cron: '0 5 * * 3'
  workflow_dispatch: {}  # allows a manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run rankings updater
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python update_rankings.py

      # Commit straight to main so the live site updates with no manual
      # step; the git log serves as the history of automated updates.
      # Skips the commit entirely when the rankings didn't change, so
      # no-op runs don't produce empty commits.
      - name: Commit updated rankings
        run: |
          if git diff --quiet -- rankings.json; then
            echo "rankings.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rankings.json
          git commit -m "Update weekly team rankings [automated]"
          git push
