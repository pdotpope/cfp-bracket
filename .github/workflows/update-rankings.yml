name: Update Weekly Rankings

on:
  schedule:
    # Monday 05:00 UTC = Sunday ~midnight ET, comfortably after the AP/
    # Coaches poll releases Sunday afternoon. Switch this to Wednesday
    # once CFP Selection Committee rankings start (they air Tuesday
    # ~7pm ET) — e.g. cron: '0 6 * * 3' for ~1am ET Wednesday. Only
    # this line needs to change; update_rankings.py already looks for
    # a CFP poll every run and falls back to AP on its own.
    - cron: '0 5 * * 1'
  workflow_dispatch: {}  # allows a manual "Run workflow" from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run rankings updater
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python update_rankings.py

      # rankings.json is machine-generated and reviewed before it reaches
      # the live site: this opens a PR instead of pushing to main so a
      # human always signs off before the GitHub Pages deploy updates.
      - name: Open PR with updated rankings
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update weekly team rankings [automated]"
          title: "Update weekly team rankings"
          body: |
            Automated rankings refresh from the College Football Data API.

            Generated by the `Update Weekly Rankings` workflow — review the
            diff in `rankings.json` before merging.
          branch: automated/update-rankings
          delete-branch: true
          add-paths: rankings.json
